name: Build revised 2026 demo history
on:
  push:
    branches: [main]
    paths: [.github/workflows/revise-history.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: revise-demo-history
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish revised demo branch
        run: |
          git switch --orphan revised-2026
          git config user.name 'Maxim Mohareb'
          git config user.email '140958895+Retixx@users.noreply.github.com'
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import date, timedelta
          from pathlib import Path

          start = date(2026, 6, 13)
          encoded = ''
          counts = [int(encoded[i:i + 2], 36) for i in range(0, len(encoded), 2)]
          assert len(counts) == 160 and sum(counts) == 844
          Path('README.md').write_text('# Contribution graph demo\n\nSynthetic commits for the 2026 contribution graph.\n')
          subprocess.run(['git', 'add', 'README.md'], check=True)
          for offset, count in enumerate(counts):
              day = start + timedelta(days=offset)
              for index in range(count):
                  hour, minute = divmod(13 * 60 + 9 * index, 60)
                  timestamp = f'{day}T{hour:02d}:{minute:02d}:00+00:00'
                  env = dict(os.environ, GIT_AUTHOR_DATE=timestamp, GIT_COMMITTER_DATE=timestamp)
                  subprocess.run(['git', 'commit', '--quiet', '--allow-empty', '-m', f'Generated activity for {day}'], env=env, check=True)
          PY
          test "$(git rev-list --count HEAD)" = 844
          git push origin HEAD:refs/heads/revised-2026
